- id: engineering-line-writing-001
  url: https://engineering.linecorp.com/ko/blog/why-are-engineers-so-bad-at-writing/
  checkedAt: "2026-09-03"
  category: engineering
  originalLanguage: ko
  authorType: practitioner
  surface: [docs]
  domain: [software]
  finding: 기술 문서는 먼저 목차와 논리 구조를 잡고 독자가 필요한 정보를 빠르게 찾게 해야 하며 문장 표현과 기술 검토가 모두 필요하다.
  decision: reuse
  generalizedRule: 문서 표면에서는 독자의 과업과 정보 구조를 먼저 정하고 자연스러운 문장만으로 기술적 빈틈을 가리지 않는다.
  exceptions: [짧은 코드 주석에는 문서 수준의 목차 구조를 요구하지 않는다.]
  evalIds: [generation-002, transfer-001]

- id: engineering-toss-qa-001
  url: https://toss.tech/article/50893
  checkedAt: "2026-09-03"
  category: engineering
  originalLanguage: ko
  authorType: practitioner
  surface: [docs, release]
  domain: [software]
  finding: 테스트와 릴리스 글은 변경 영향, 확인 범위, 판단 근거를 구체적인 동사와 수치로 설명하며 추상적인 품질 주장만 반복하지 않는다.
  decision: reuse
  generalizedRule: 테스트·릴리스 산출물은 무엇을 확인했고 어떤 위험을 남겼는지 관찰 가능한 정보로 작성한다.
  exceptions:
    [UI 레이블처럼 공간이 제한된 표면에는 상세 검증 근거를 넣지 않는다.]
  evalIds: [generation-003, repair-002]

- id: engineering-kakao-review-001
  url: https://tech.kakao.com/posts/501
  checkedAt: "2026-09-03"
  category: engineering
  originalLanguage: ko
  authorType: practitioner
  surface: [review, pr]
  domain: [frontend]
  finding: 코드 리뷰는 사람의 능력을 평가하는 보고서가 아니라 더 나은 결과물을 함께 만들기 위한 협업 행위로 서술된다.
  decision: reuse
  generalizedRule: 리뷰 코멘트는 사람을 평가하지 말고 코드의 동작, 영향, 근거, 제안을 전문적인 해요체로 설명한다.
  exceptions: [저장소에 확립된 다른 리뷰 문체가 있으면 그 문체를 유지한다.]
  evalIds: [generation-004, conflict-002]

- id: engineering-toss-ssot-001
  url: https://toss.tech/article/technical-writing-1
  checkedAt: "2026-09-03"
  category: engineering
  originalLanguage: ko
  authorType: practitioner
  surface: [docs]
  domain: [software]
  finding: 기술 문서의 목표는 글을 꾸미는 것이 아니라 독자가 문제를 해결하게 돕는 것이며 신뢰할 수 있는 단일 정보 원본이 중요하다.
  decision: reuse
  generalizedRule: 언어 정책은 단일 원본에서 관리하고 문서 표현은 독자의 다음 행동과 문제 해결을 우선한다.
  exceptions:
    [
      법적 고지처럼 정확한 정형 표현이 필요한 문서는 행동 중심 표현만 강제하지 않는다.,
    ]
  evalIds: [transfer-002, preserve-002]

- id: ux-toss-principles-001
  url: https://toss.tech/article/21022
  checkedAt: "2026-09-03"
  category: ux
  originalLanguage: ko
  authorType: practitioner
  surface: [ui, error]
  domain: [frontend]
  finding: UI 문구는 어렵거나 모호한 단어를 줄이고 한 화면에서 당장 일어날 일과 사용자가 얻는 값을 이해하기 쉽게 알려 준다.
  decision: reuse
  generalizedRule: UI와 오류 문구는 사용자의 현재 맥락, 결과, 가능한 다음 행동을 짧고 직접적인 표현으로 제공한다.
  exceptions:
    [
      보안상 세부 원인을 노출하면 안 되는 오류는 안전한 범위의 다음 행동만 안내한다.,
    ]
  evalIds: [repair-003, generation-005]

- id: ux-toss-system-001
  url: https://toss.tech/article/1st_uxwriter
  checkedAt: "2026-09-03"
  category: ux
  originalLanguage: ko
  authorType: practitioner
  surface: [ui, docs]
  domain: [frontend]
  finding: 개별 문구를 고치는 것만으로는 일관된 품질을 만들 수 없고 팀이 공유할 원칙과 좁은 화면 제약을 함께 고려해야 한다.
  decision: reuse
  generalizedRule: 표면별 길이와 정보량을 구분하고 공통 원칙은 공유하되 모든 산출물을 같은 문체와 길이로 만들지 않는다.
  exceptions:
    [기존 제품 보이스와 디자인 시스템 문구가 있으면 그것이 기본값보다 우선한다.]
  evalIds: [conflict-003, transfer-003]

