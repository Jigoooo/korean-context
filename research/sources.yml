  decision: adapt
  generalizedRule: 보안 산출물은 tactic, technique, 도구, 관찰된 행위를 서로 바꾸어 쓰지 않고 필요한 경우 영문 분류명을 보존한다.
  exceptions:
    [
      일반 사용자용 알림에서는 ATT&CK 분류보다 이해 가능한 영향과 대응을 우선한다.,
    ]
  evalIds: [generation-007, conflict-005]
